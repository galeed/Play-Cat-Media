<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web Audio Workstation & Step Sequencer</title>
    <!-- Incluir jsmediatags desde CDN para metadatos ID3 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jsmediatags/3.9.5/jsmediatags.min.js"></script>
    <style>
        :root {
            --bg-color: #121212;
            --panel-bg: #1e1e1e;
            --accent-color: #00ffcc;
            --text-color: #e0e0e0;
            --border-color: #333;
        }
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: monospace, sans-serif;
        }
        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            padding: 20px;
        }
        h1 {
            text-align: center;
            margin-bottom: 20px;
            color: var(--accent-color);
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        .panel {
            background-color: var(--panel-bg);
            border: 1px solid var(--border-color);
            padding: 15px;
            border-radius: 8px;
        }
        .panel h2 {
            font-size: 1.1rem;
            margin-bottom: 10px;
            color: var(--accent-color);
        }
        input[type="file"] {
            width: 100%;
            padding: 10px;
            background: #2a2a2a;
            border: 1px dashed var(--accent-color);
            color: var(--text-color);
            cursor: pointer;
            border-radius: 4px;
        }
        .metadata-display {
            margin-top: 10px;
            font-size: 0.9rem;
            background: #111;
            padding: 10px;
            border-radius: 4px;
            border-left: 3px solid var(--accent-color);
        }
        .controls {
            display: flex;
            gap: 10px;
            align-items: center;
            flex-wrap: wrap;
        }
        button {
            background: var(--accent-color);
            color: #000;
            border: none;
            padding: 8px 16px;
            font-weight: bold;
            cursor: pointer;
            border-radius: 4px;
        }
        button:hover {
            opacity: 0.8;
        }
        .sequencer-grid {
            display: grid;
            grid-template-columns: repeat(16, 1fr);
            gap: 5px;
            margin-top: 10px;
        }
        .step-btn {
            aspect-ratio: 1;
            background: #2a2a2a;
            border: 1px solid var(--border-color);
            cursor: pointer;
            border-radius: 3px;
        }
        .step-btn.active {
            background: var(--accent-color);
        }
        .step-btn.current {
            border-color: #ffffff;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Audio Workstation & Sequencer</h1>

        <!-- Panel de Carga y Metadatos -->
        <div class="panel">
            <h2>1. Cargar Archivo de Audio</h2>
            <input type="file" id="audioFileInput" accept="audio/*">
            <div class="metadata-display" id="metadataInfo">
                <em>No hay archivo cargado. Selecciona un archivo de audio para leer sus metadatos.</em>
            </div>
        </div>

        <!-- Panel de Reproducción -->
        <div class="panel">
            <h2>2. Controles de Reproducción</h2>
            <div class="controls">
                <button id="playBtn">Reproducir</button>
                <button id="stopBtn">Detener</button>
                <span>Volumen: <input type="range" id="volumeControl" min="0" max="1" step="0.01" value="0.8"></span>
            </div>
        </div>

        <!-- Panel de Secuenciador por Pasos -->
        <div class="panel">
            <h2>3. Step Sequencer (16 Pasos)</h2>
            <div class="controls" style="margin-bottom: 10px;">
                <button id="seqPlayBtn">Iniciar Secuenciador</button>
                <span>BPM: <input type="number" id="bpmInput" value="120" min="60" max="200" style="width: 60px; padding: 4px; background: #2a2a2a; color: #fff; border: 1px solid #444;"></span>
            </div>
            <div class="sequencer-grid" id="sequencerGrid"></div>
        </div>
    </div>

    <script>
        // Inicializar contexto de audio
        let audioCtx = null;
        let audioBuffer = null;
        let sourceNode = null;
        let gainNode = null;

        const fileInput = document.getElementById('audioFileInput');
        const metadataInfo = document.getElementById('metadataInfo');
        const playBtn = document.getElementById('playBtn');
        const stopBtn = document.getElementById('stopBtn');
        const volumeControl = document.getElementById('volumeControl');

        // Manejo de Carga de Archivos y Metadatos con jsmediatags
        fileInput.addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;

            // 1. Leer Metadatos ID3 usando jsmediatags
            window.jsmediatags.read(file, {
                onSuccess: function(tag) {
                    const tags = tag.tags;
                    const title = tags.title || file.name;
                    const artist = tags.artist || 'Artista Desconocido';
                    const album = tags.album || 'Álbum Desconocido';
                    const year = tags.year || '';

                    metadataInfo.innerHTML = `
                        <strong>Título:</strong> ${title}<br>
                        <strong>Artista:</strong> ${artist}<br>
                        <strong>Álbum:</strong> ${album} ${year ? '(' + year + ')' : ''}
                    `;
                },
                onError: function(error) {
                    console.warn("No se pudieron leer los metadatos ID3:", error);
                    metadataInfo.innerHTML = `<strong>Archivo:</strong> ${file.name} <em>(Sin metadatos o formato no compatible)</em>`;
                }
            });

            // 2. Decodificar el Audio para Web Audio API
            const reader = new FileReader();
            reader.onload = function(event) {
                const arrayBuffer = event.target.result;
                
                if (!audioCtx) {
                    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                }

                audioCtx.decodeAudioData(arrayBuffer, function(buffer) {
                    audioBuffer = buffer;
                    console.log("Audio decodificado correctamente.");
                }, function(err) {
                    console.error("Error al decodificar el audio", err);
                    alert("No se pudo decodificar el archivo de audio.");
                });
            };
            reader.readAsArrayBuffer(file);
        });

        // Controles de Reproducción Básica
        playBtn.addEventListener('click', () => {
            if (!audioBuffer) {
                alert("Por favor, carga un archivo de audio primero.");
                return;
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }

            if (sourceNode) {
                sourceNode.stop();
            }

            sourceNode = audioCtx.createBufferSource();
            sourceNode.buffer = audioBuffer;

            gainNode = audioCtx.createGain();
            gainNode.gain.value = volumeControl.value;

            sourceNode.connect(gainNode);
            gainNode.connect(audioCtx.destination);

            sourceNode.start(0);
        });

        stopBtn.addEventListener('click', () => {
            if (sourceNode) {
                sourceNode.stop();
                sourceNode = null;
            }
        });

        volumeControl.addEventListener('input', (e) => {
            if (gainNode && audioCtx) {
                gainNode.gain.setValueAtTime(e.target.value, audioCtx.currentTime);
            }
        });

        // Step Sequencer Logic
        const sequencerGrid = document.getElementById('sequencerGrid');
        const stepsCount = 16;
        const sequencerSteps = Array(stepsCount).fill(false);
        const stepButtons = [];

        // Generar botones de la cuadrícula
        for (let i = 0; i < stepsCount; i++) {
            const btn = document.createElement('button');
            btn.classList.add('step-btn');
            btn.addEventListener('click', () => {
                sequencerSteps[i] = !sequencerSteps[i];
                btn.classList.toggle('active', sequencerSteps[i]);
            });
            sequencerGrid.appendChild(btn);
            stepButtons.push(btn);
        }

        let isSeqPlaying = false;
        let currentStep = 0;
        let seqInterval = null;
        const seqPlayBtn = document.getElementById('seqPlayBtn');
        const bpmInput = document.getElementById('bpmInput');

        seqPlayBtn.addEventListener('click', () => {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }

            isSeqPlaying = !isSeqPlaying;
            if (isSeqPlaying) {
                seqPlayBtn.textContent = "Detener Secuenciador";
                startSequencer();
            } else {
                seqPlayBtn.textContent = "Iniciar Secuenciador";
                stopSequencer();
            }
        });

        function startSequencer() {
            const bpm = parseInt(bpmInput.value) || 120;
            // Corchea / semicorchea interval calculation (60000 / bpm / 4)
            const intervalTime = (60000 / bpm) / 4; 

            seqInterval = setInterval(() => {
                // Limpiar paso anterior
                stepButtons.forEach(b => b.classList.remove('current'));
                // Marcar paso actual
                stepButtons[currentStep].classList.add('current');

                // Si el paso está activo, disparar sonido de prueba (kick sintético o sonido breve)
                if (sequencerSteps[currentStep]) {
                    playStepSound();
                }

                currentStep = (currentStep + 1) % stepsCount;
            }, intervalTime);
        }

        function stopSequencer() {
            clearInterval(seqInterval);
            stepButtons.forEach(b => b.classList.remove('current'));
            currentStep = 0;
        }

        function playStepSound() {
            if (!audioCtx) return;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            
            osc.type = 'sine';
            osc.frequency.setValueAtTime(150, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.15);

            gain.gain.setValueAtTime(0.5, audioCtx.currentTime);
            gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.15);

            osc.connect(gain);
            gain.connect(audioCtx.destination);

            osc.start();
            osc.stop(audioCtx.currentTime + 0.15);
        }
    </script>
</body>
</html>
