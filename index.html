<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Michi Studio</title>
    <style>
        :root {
            --bg-color: #0b0c10;
            --card-bg: rgba(25, 27, 38, 0.85);
            --accent-color: #00ffcc;
            --text-main: #ffffff;
            --text-sub: #a0a5b5;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
            position: relative;
        }

        /* Dynamic Background Blur */
        .bg-cover {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-size: cover;
            background-position: center;
            filter: blur(30px) brightness(0.4);
            z-index: 1;
            transition: background-image 0.5s ease-in-out;
        }

        .player-card {
            position: relative;
            z-index: 2;
            width: 90%;
            max-width: 400px;
            background: var(--card-bg);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border-radius: 20px;
            padding: 24px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            border: 1px solid rgba(255, 255, 255, 0.1);
            text-align: center;
        }

        .artwork-container {
            width: 100%;
            padding-top: 100%;
            position: relative;
            border-radius: 12px;
            overflow: hidden;
            margin-bottom: 20px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.4);
        }

        .artwork-container img {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .track-info {
            margin-bottom: 20px;
        }

        .track-title {
            font-size: 1.25rem;
            font-weight: 700;
            margin: 0 0 6px 0;
            color: var(--text-main);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .track-artist {
            font-size: 0.95rem;
            color: var(--text-sub);
            margin: 0;
        }

        /* Controls & Progress */
        .progress-container {
            width: 100%;
            margin-bottom: 20px;
        }

        .progress-bar {
            width: 100%;
            -webkit-appearance: none;
            appearance: none;
            height: 6px;
            border-radius: 3px;
            background: rgba(255, 255, 255, 0.2);
            outline: none;
        }

        .progress-bar::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: var(--accent-color);
            cursor: pointer;
        }

        .time-stamps {
            display: flex;
            justify-content: space-between;
            font-size: 0.75rem;
            color: var(--text-sub);
            margin-top: 6px;
        }

        .controls {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
        }

        .btn {
            background: none;
            border: none;
            color: var(--text-main);
            font-size: 1.5rem;
            cursor: pointer;
            transition: transform 0.1s ease, color 0.2s ease;
        }

        .btn:active {
            transform: scale(0.9);
        }

        .btn-play {
            width: 56px;
            height: 56px;
            border-radius: 50%;
            background: var(--accent-color);
            color: #000;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
        }
    </style>
</head>
<body>

    <div class="bg-cover" id="bgCover"></div>

    <div class="player-card">
        <div class="artwork-container">
            <img id="artwork" src="https://via.placeholder.com/400" alt="Portada de canción">
        </div>

        <div class="track-info">
            <h2 class="track-title" id="trackTitle">Título de la Canción</h2>
            <p class="track-artist" id="trackArtist">Artista</p>
        </div>

        <div class="progress-container">
            <input type="range" class="progress-bar" id="progressBar" value="0" min="0" max="100">
            <div class="time-stamps">
                <span id="currentTime">0:00</span>
                <span id="duration">0:00</span>
            </div>
        </div>

        <div class="controls">
            <button class="btn" id="prevBtn">⏮</button>
            <button class="btn btn-play" id="playBtn">▶</button>
            <button class="btn" id="nextBtn">⏭</button>
        </div>

        <audio id="audioPlayer" playsinline></audio>
    </div>

    <script>
        const audio = document.getElementById('audioPlayer');
        const playBtn = document.getElementById('playBtn');
        const progressBar = document.getElementById('progressBar');
        const currentTimeEl = document.getElementById('currentTime');
        const durationEl = document.getElementById('duration');

        let isPlaying = false;

        // Toggle Play / Pause
        playBtn.addEventListener('click', () => {
            if (isPlaying) {
                audio.pause();
                playBtn.textContent = '▶';
            } else {
                audio.play();
                playBtn.textContent = '⏸';
            }
            isPlaying = !isPlaying;
        });

        // Update progress bar
        audio.addEventListener('timeupdate', () => {
            if (audio.duration) {
                const progressPercent = (audio.currentTime / audio.duration) * 100;
                progressBar.value = progressPercent;
                currentTimeEl.textContent = formatTime(audio.currentTime);
                durationEl.textContent = formatTime(audio.duration);
            }
        });

        // Seek audio
        progressBar.addEventListener('input', () => {
            if (audio.duration) {
                audio.currentTime = (progressBar.value / 100) * audio.duration;
            }
        });

        // MediaSession API configuration for background playback (iOS/Android)
        if ('mediaSession' in navigator) {
            navigator.mediaSession.metadata = new MediaMetadata({
                title: 'Michi Studio Track',
                artist: 'Michi Studio',
                album: 'Michi Release'
            });

            navigator.mediaSession.setActionHandler('play', () => {
                audio.play();
                playBtn.textContent = '⏸';
                isPlaying = true;
            });

            navigator.mediaSession.setActionHandler('pause', () => {
                audio.pause();
                playBtn.textContent = '▶';
                isPlaying = false;
            });
        }

        function formatTime(seconds) {
            const mins = Math.floor(seconds / 60);
            const secs = Math.floor(seconds % 60);
            return `${mins}:${secs < 10 ? '0' : ''}${secs}`;
        }
    </script>
</body>
</html>
