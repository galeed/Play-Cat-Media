<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Red Book Audio Player</title>

  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#111111">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="RedBookPlayer">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="apple-touch-icon" href="icon-180.png">

<style>
  :root {
    --bg: #0d0d11;
    --card: rgba(255, 255, 255, 0.12); /* Transparencia de cristal */
    --card-border: rgba(255, 255, 255, 0.25);
    --accent: #ff4757;
    --text: #ffffff;
    --text-muted: rgba(255, 255, 255, 0.7);
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }

  body {
    background-color: var(--bg);
    color: var(--text);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 20px;
    position: relative;
    overflow: hidden;
  }

  .bg-blur {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background-size: cover;
    background-position: center;
    filter: blur(50px) brightness(0.6) saturate(1.5);
    transform: scale(1.2);
    transition: background-image 0.8s ease-in-out;
    z-index: -1;
  }

  .player-card {
    background: var(--card);
    backdrop-filter: blur(35px) saturate(180%);
    -webkit-backdrop-filter: blur(35px) saturate(180%);
    width: 100%;
    max-width: 360px;
    padding: 24px;
    border-radius: 28px;
    box-shadow: 0 20px 50px rgba(0, 0, 0, 0.3),
                inset 0 1px 1px rgba(255, 255, 255, 0.3);
    border: 1px solid var(--card-border);
    text-align: center;
    z-index: 1;
    position: relative;
  }

  .player-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 15px;
  }

  .header-title {
    font-size: 0.85rem;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: var(--text-muted);
  }

  .btn-icon {
    background: rgba(255, 255, 255, 0.15);
    border: 1px solid rgba(255, 255, 255, 0.2);
    color: var(--text);
    width: 36px;
    height: 36px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    font-size: 1.1rem;
    backdrop-filter: blur(10px);
    transition: background 0.2s, transform 0.1s;
  }

  .btn-icon:active {
    transform: scale(0.92);
  }

  .cover-art {
    width: 100%;
    aspect-ratio: 1 / 1;
    background: rgba(255, 255, 255, 0.1);
    border-radius: 20px;
    object-fit: cover;
    margin-bottom: 15px;
    display: block;
    box-shadow: 0 12px 30px rgba(0, 0, 0, 0.3);
    border: 1px solid rgba(255, 255, 255, 0.15);
  }

  .track-info {
    margin-bottom: 10px;
  }

  .track-title {
    font-size: 1.25rem;
    font-weight: 700;
    margin-bottom: 4px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    text-shadow: 0 2px 4px rgba(0, 0, 0, 0.3);
  }

  .track-artist {
    font-size: 0.9rem;
    color: var(--text-muted);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .track-album {
    font-size: 0.75rem;
    color: var(--text-muted);
    margin-top: 2px;
    opacity: 0.8;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .status-badge {
    font-size: 0.8rem;
    color: var(--accent);
    min-height: 20px;
    margin-bottom: 10px;
    font-weight: 600;
  }

  .eq-container {
    margin-bottom: 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: rgba(0, 0, 0, 0.2);
    border: 1px solid rgba(255, 255, 255, 0.1);
    padding: 8px 14px;
    border-radius: 14px;
    backdrop-filter: blur(10px);
  }

  .eq-label {
    font-size: 0.85rem;
    color: var(--text-muted);
    font-weight: 500;
  }

  .eq-select {
    background: transparent;
    color: var(--accent);
    border: none;
    font-size: 0.85rem;
    font-weight: 600;
    outline: none;
    text-align: right;
    cursor: pointer;
    max-width: 180px;
  }

  .eq-select option {
    background: #1c1c24;
    color: var(--text);
  }

  .progress-container {
    width: 100%;
    margin-bottom: 15px;
  }

  .seek-bar {
    width: 100%;
    -webkit-appearance: none;
    appearance: none;
    height: 6px;
    border-radius: 3px;
    background: rgba(255, 255, 255, 0.2);
    outline: none;
    cursor: pointer;
  }

  .seek-bar::-webkit-slider-thumb {
    -webkit-appearance: none;
    appearance: none;
    width: 14px;
    height: 14px;
    border-radius: 50%;
    background: var(--text);
    box-shadow: 0 0 10px rgba(0, 0, 0, 0.5);
    cursor: pointer;
    transition: transform 0.1s ease;
  }

  .seek-bar::-webkit-slider-thumb:active {
    transform: scale(1.3);
  }

  .time-stamps {
    display: flex;
    justify-content: space-between;
    font-size: 0.75rem;
    color: var(--text-muted);
    margin-top: 6px;
  }

  .controls {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    margin-bottom: 15px;
  }

  .btn {
    background: none;
    border: none;
    color: var(--text);
    font-size: 1.5rem;
    cursor: pointer;
    padding: 8px;
    transition: transform 0.1s ease;
    text-shadow: 0 2px 5px rgba(0,0,0,0.3);
  }

  .btn:active {
    transform: scale(0.88);
  }

  .btn-play {
    background: var(--text);
    color: #121216;
    width: 60px;
    height: 60px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.8rem;
    box-shadow: 0 8px 20px rgba(0,0,0,0.3);
    text-shadow: none;
  }

  .btn-sub {
    font-size: 1.2rem;
    opacity: 0.4;
    transition: opacity 0.2s, color 0.2s;
  }

  .btn-sub.active {
    opacity: 1;
    color: var(--accent);
  }

  .file-input-wrapper {
    margin-top: 5px;
    position: relative;
  }

  .file-label {
    background: rgba(255, 255, 255, 0.15);
    border: 1px solid rgba(255, 255, 255, 0.2);
    color: var(--text);
    padding: 12px 20px;
    border-radius: 14px;
    font-size: 0.9rem;
    cursor: pointer;
    display: inline-block;
    font-weight: 500;
    backdrop-filter: blur(10px);
    transition: background 0.2s;
  }

  .file-label:hover {
    background: rgba(255, 255, 255, 0.25);
  }

  input[type="file"] {
    opacity: 0;
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    cursor: pointer;
    z-index: 2;
  }

  .playlist-overlay {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(20, 20, 28, 0.75);
    backdrop-filter: blur(30px);
    -webkit-backdrop-filter: blur(30px);
    border-radius: 28px;
    padding: 20px;
    display: flex;
    flex-direction: column;
    z-index: 10;
    transform: translateY(100%);
    transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
  }

  .playlist-overlay.active {
    transform: translateY(0);
  }

  .playlist-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 15px;
    padding-bottom: 10px;
    border-bottom: 1px solid rgba(255, 255, 255, 0.15);
  }

  .playlist-title {
    font-size: 1rem;
    font-weight: 700;
  }

  .playlist-list {
    list-style: none;
    overflow-y: auto;
    flex: 1;
    text-align: left;
  }

  .playlist-item {
    padding: 10px 12px;
    border-radius: 12px;
    margin-bottom: 6px;
    cursor: pointer;
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: rgba(255, 255, 255, 0.05);
    border: 1px solid rgba(255, 255, 255, 0.08);
    transition: background 0.2s;
  }

  .playlist-item.playing {
    background: rgba(255, 71, 87, 0.25);
    border: 1px solid rgba(255, 71, 87, 0.5);
  }

  .playlist-item-title {
    font-size: 0.85rem;
    font-weight: 600;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    max-width: 220px;
  }

  .playlist-item-artist {
    font-size: 0.75rem;
    color: var(--text-muted);
  }
</style>
</body>
</html>
