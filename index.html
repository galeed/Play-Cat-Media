<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Reproductor PWA Multiformato</title>

  <!-- Configuraciones PWA para iOS / Safari -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#1e1e24">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="MiReproductor">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="apple-touch-icon" href="icon-180.png">

  <style>
    :root {
      --bg: #121216;
      --card: #1e1e24;
      --accent: #ff4757;
      --text: #ffffff;
      --text-muted: #a0a0aa;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
    }

    .player-card {
      background: var(--card);
      width: 100%;
      max-width: 360px;
      padding: 24px;
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      text-align: center;
    }

    .cover-art {
      width: 100%;
      height: 240px;
      background: #2a2a32;
      border-radius: 14px;
      object-fit: cover;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .track-info {
      margin-bottom: 8px;
    }

    .track-title {
      font-size: 1.2rem;
      font-weight: 700;
      margin-bottom: 4px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .track-artist {
      font-size: 0.9rem;
      color: var(--text-muted);
    }

    .status-badge {
      font-size: 0.8rem;
      color: var(--accent);
      min-height: 20px;
      margin-bottom: 10px;
      font-weight: 600;
    }

    /* BARRA DE PROGRESO Y TIEMPOS */
    .progress-container {
      width: 100%;
      margin-bottom: 15px;
    }

    .seek-bar {
      width: 100%;
      -webkit-appearance: none;
      appearance: none;
      height: 6px;
      border-radius: 3px;
      background: #2c2c36;
      outline: none;
      cursor: pointer;
    }

    /* Estilo del "botón" deslizador para Safari/Webkit */
    .seek-bar::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: var(--accent);
      cursor: pointer;
      transition: transform 0.1s ease;
    }

    .seek-bar::-webkit-slider-thumb:active {
      transform: scale(1.3);
    }

    /* Estilo del deslizador para Firefox */
    .seek-bar::-moz-range-thumb {
      width: 14px;
      height: 14px;
      border: none;
      border-radius: 50%;
      background: var(--accent);
      cursor: pointer;
    }

    .time-stamps {
      display: flex;
      justify-content: space-between;
      font-size: 0.75rem;
      color: var(--text-muted);
      margin-top: 6px;
    }

    .controls {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 20px;
      margin-bottom: 15px;
    }

    .btn {
      background: none;
      border: none;
      color: var(--text);
      font-size: 1.5rem;
      cursor: pointer;
      padding: 10px;
      transition: transform 0.1s ease;
    }

    .btn:active {
      transform: scale(0.9);
    }

    .btn-play {
      background: var(--accent);
      width: 60px;
      height: 60px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.8rem;
    }

    .file-input-wrapper {
      margin-top: 5px;
      position: relative;
    }

    .file-label {
      background: #2c2c36;
      color: var(--text);
      padding: 12px 20px;
      border-radius: 10px;
      font-size: 0.9rem;
      cursor: pointer;
      display: inline-block;
      font-weight: 500;
    }

    input[type="file"] {
      opacity: 0;
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      cursor: pointer;
      z-index: 2;
    }
  </style>

  <!-- Librería UMD de FFmpeg v0.11.6 -->
  <script src="https://unpkg.com/@ffmpeg/ffmpeg@0.11.6/dist/ffmpeg.min.js"></script>
</head>
<body>

  <div class="player-card">
    <img id="cover" class="cover-art" src="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' width='100' height='100' viewBox='0 0 24 24' fill='none' stroke='%23a0a0aa' stroke-width='1.5'><path d='M9 18V5l12-2v13'/><circle cx='6' cy='18' r='3'/><circle cx='18' cy='16' r='3'/></svg>" alt="Portada">

    <div class="track-info">
      <div id="title" class="track-title">Sin archivo seleccionado</div>
      <div id="artist" class="track-artist">Carga audios locales</div>
    </div>

    <div id="status" class="status-badge"></div>

    <!-- Barra de desplazamiento y tiempos -->
    <div class="progress-container">
      <input type="range" id="seekBar" class="seek-bar" value="0" min="0" max="100" step="0.1">
      <div class="time-stamps">
        <span id="currentTime">00:00</span>
        <span id="duration">00:00</span>
      </div>
    </div>

    <div class="controls">
      <button class="btn" id="btnPrev">⏮</button>
      <button class="btn btn-play" id="btnPlay">▶</button>
      <button class="btn" id="btnNext">⏭</button>
    </div>

    <div class="file-input-wrapper">
      <span class="file-label">📁 Seleccionar archivos</span>
      <input type="file" id="fileInput" accept=".mp3, .wav, .ogg, .m4a, .flac, .aac, .wma, .opus, .aiff, audio/*" multiple>
    </div>
  </div>

  <audio id="audio"></audio>

  <script>
    const { createFFmpeg, fetchFile } = FFmpeg;

    // Elementos del DOM
    const audio = document.getElementById('audio');
    const btnPlay = document.getElementById('btnPlay');
    const btnPrev = document.getElementById('btnPrev');
    const btnNext = document.getElementById('btnNext');
    const titleEl = document.getElementById('title');
    const artistEl = document.getElementById('artist');
    const statusEl = document.getElementById('status');
    const fileInput = document.getElementById('fileInput');

    // Elementos de la barra de control
    const seekBar = document.getElementById('seekBar');
    const currentTimeEl = document.getElementById('currentTime');
    const durationEl = document.getElementById('duration');

    let playlist = [];
    let currentIndex = 0;
    let ffmpeg = null;
    let currentObjectUrl = null;
    let isUserSeeking = false; // Previene parpadeos al arrastrar el slider

    // Formatear segundos a 00:00
    function formatTime(seconds) {
      if (isNaN(seconds) || seconds === Infinity) return "00:00";
      const mins = Math.floor(seconds / 60);
      const secs = Math.floor(seconds % 60);
      return `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
    }

    // Inicializador FFmpeg
    async function getFFmpeg() {
      if (!ffmpeg) {
        ffmpeg = createFFmpeg({ log: false });
      }
      if (!ffmpeg.isLoaded()) {
        statusEl.textContent = "Cargando motor WebAssembly...";
        await ffmpeg.load();
        statusEl.textContent = "";
      }
      return ffmpeg;
    }

    // Comprobación de reproducción nativa
    function canPlayNatively(file) {
      if (!file) return false;
      const ext = file.name.split('.').pop().toLowerCase();
      const nativeExtensions = ['mp3', 'wav', 'm4a', 'aac', 'flac'];
      if (nativeExtensions.includes(ext)) return true;

      if (file.type) {
        const result = audio.canPlayType(file.type);
        if (result === "probably" || result === "maybe") return true;
      }

      return false;
    }

    // Evento al cargar archivos
    fileInput.addEventListener('change', (e) => {
      const files = Array.from(e.target.files);
      if (files.length === 0) return;

      playlist = files.map(file => ({
        file: file,
        name: file.name.replace(/\.[^/.]+$/, ""),
        ext: file.name.split('.').pop().toLowerCase()
      }));

      currentIndex = 0;
      processAndPlayTrack(currentIndex);
    });

    // Procesamiento y reproducción
    async function processAndPlayTrack(index) {
      if (!playlist[index]) return;

      const track = playlist[index];
      titleEl.textContent = track.name;
      artistEl.textContent = `Formato: .${track.ext.toUpperCase()}`;
      
      // Reiniciar barra de tiempo
      seekBar.value = 0;
      currentTimeEl.textContent = "00:00";
      durationEl.textContent = "00:00";

      if (currentObjectUrl) {
        URL.revokeObjectURL(currentObjectUrl);
        currentObjectUrl = null;
      }

      // Archivos nativos
      if (canPlayNatively(track.file)) {
        statusEl.textContent = "";
        currentObjectUrl = URL.createObjectURL(track.file);
        startPlayback(currentObjectUrl, track.name);
      } 
      // Archivos no nativos decodificados por WASM
      else {
        try {
          statusEl.textContent = `Decodificando .${track.ext}...`;
          const ff = await getFFmpeg();

          const inputName = `input.${track.ext}`;
          const outputName = 'output.wav';

          ff.FS('writeFile', inputName, await fetchFile(track.file));
          await ff.run('-i', inputName, '-acodec', 'pcm_s16le', '-ar', '44100', outputName);

          const data = ff.FS('readFile', outputName);
          const audioBlob = new Blob([data.buffer], { type: 'audio/wav' });
          currentObjectUrl = URL.createObjectURL(audioBlob);

          ff.FS('unlink', inputName);
          ff.FS('unlink', outputName);

          statusEl.textContent = "";
          startPlayback(currentObjectUrl, track.name);

        } catch (error) {
          console.error("Error al procesar audio:", error);
          statusEl.textContent = "Error al abrir el archivo";
        }
      }
    }

    // Iniciar reproducción y configurar Media Session
    function startPlayback(url, title) {
      audio.src = url;
      updateMediaSession(title);

      audio.play().then(() => {
        btnPlay.textContent = '⏸';
      }).catch(err => {
        console.log("Esperando toque del usuario para reproducir:", err);
        btnPlay.textContent = '▶';
      });
    }

    // Media Session API
    function updateMediaSession(title) {
      if ('mediaSession' in navigator) {
        navigator.mediaSession.metadata = new MediaMetadata({
          title: title,
          artist: 'Biblioteca Local',
          album: 'Reproductor Multiformato',
          artwork: [
            { src: 'icon-180.png', sizes: '180x180', type: 'image/png' }
          ]
        });

        navigator.mediaSession.setActionHandler('play', () => {
          audio.play();
          btnPlay.textContent = '⏸';
        });

        navigator.mediaSession.setActionHandler('pause', () => {
          audio.pause();
          btnPlay.textContent = '▶';
        });

        navigator.mediaSession.setActionHandler('previoustrack', playPrev);
        navigator.mediaSession.setActionHandler('nexttrack', playNext);

        // Posicionamiento en pantalla de bloqueo (iOS/Android)
        try {
          navigator.mediaSession.setActionHandler('seekto', (details) => {
            if (details.seekTime) {
              audio.currentTime = details.seekTime;
            }
          });
        } catch (e) {
          // Ignorar si el navegador no soporta seekto
        }
      }
    }

    // LOGICA DE LA BARRA DE DESPLAZAMIENTO (SEEK BAR)

    // 1. Cargar la duración cuando la pista está lista
    audio.addEventListener('loadedmetadata', () => {
      durationEl.textContent = formatTime(audio.duration);
    });

    // 2. Actualizar la barra y el tiempo actual mientras se reproduce
    audio.addEventListener('timeupdate', () => {
      if (!isUserSeeking && audio.duration) {
        const progress = (audio.currentTime / audio.duration) * 100;
        seekBar.value = progress;
        currentTimeEl.textContent = formatTime(audio.currentTime);
      }
    });

    // 3. Cuando el usuario empieza a mover el slider
    seekBar.addEventListener('input', () => {
      isUserSeeking = true;
      if (audio.duration) {
        const seekTime = (seekBar.value / 100) * audio.duration;
        currentTimeEl.textContent = formatTime(seekTime);
      }
    });

    // 4. Cuando el usuario suelta el slider (saltar al punto seleccionado)
    seekBar.addEventListener('change', () => {
      if (audio.duration) {
        audio.currentTime = (seekBar.value / 100) * audio.duration;
      }
      isUserSeeking = false;
    });

    // Controles de interfaz
    function togglePlay() {
      if (!audio.src) return;

      if (audio.paused) {
        audio.play();
        btnPlay.textContent = '⏸';
      } else {
        audio.pause();
        btnPlay.textContent = '▶';
      }
    }

    function playNext() {
      if (playlist.length === 0) return;
      currentIndex = (currentIndex + 1) % playlist.length;
      processAndPlayTrack(currentIndex);
    }

    function playPrev() {
      if (playlist.length === 0) return;
      currentIndex = (currentIndex - 1 + playlist.length) % playlist.length;
      processAndPlayTrack(currentIndex);
    }

    btnPlay.addEventListener('click', togglePlay);
    btnNext.addEventListener('click', playNext);
    btnPrev.addEventListener('click', playPrev);
    audio.addEventListener('ended', playNext);
  </script>
</body>
</html>
